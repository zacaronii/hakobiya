[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hakobiya"
version = "0.10.0"
description = "Pick files out of Minerva's torrent sets, send them to qBittorrent and file them into RomM"
requires-python = ">=3.11"
license = {text = "GPL-3.0-only"}
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "httpx>=0.27", "python-multipart>=0.0.9", "pillow>=10.1", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "pypdf>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hakobiya = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
